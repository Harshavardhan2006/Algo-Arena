server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algoarena}
    username: ${SPRING_DATASOURCE_USERNAME:algoarena}
    password: ${SPRING_DATASOURCE_PASSWORD:algoarena}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:algoarena-prod-secret-change-me-012345678901234567890123456789}
  expiration-ms: 86400000

algoarena:
  execution:
    max-runtime-seconds: 30
    max-time-limit-seconds: 600
    workers-base-path: ${WORKERS_BASE_PATH:../workers}
    docker-image: ${DOCKER_IMAGE:algoarena-worker:latest}
    memory-limit: 256m
    cpu-limit: "1"

logging:
  level:
    com.algoarena: INFO
    org.springframework.security: WARN

